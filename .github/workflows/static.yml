# Publication statique vers GitHub Pages, sans Jekyll.
# Le build « pages-build-deployment » du 2026-09-29 a échoué parce que Jekyll
# essayait de rendre Document_suivre.md, qui est un fichier Word (octets non UTF-8).
# .nojekyll empêche un retour à ce build. Seul le site public est envoyé :
# tools/, docs/, .cursor/ et les notes internes ne doivent pas être en ligne.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérifier le site
        run: python3 tools/check_site.py
      - name: Préparer la publication
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a index.html 404.html mentions-legales.html cgv.html politique-confidentialite.html sitemap.xml robots.txt .htaccess .nojekyll _site/
          cp -a css js images vendor oeuvres _site/
          test ! -e _site/tools
          test ! -e _site/docs
          test ! -e _site/Document_suivre.docx
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
